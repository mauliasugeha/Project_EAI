spring.application.name=ecommerce
# Server Configuration
server.port=8080

# RabbitMQ Connection
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Queue per service (Pub-Sub pattern: setiap service punya queue sendiri)
rabbitmq.queue.payment=order.payment.queue
rabbitmq.queue.inventory=order.inventory.queue
rabbitmq.queue.email=order.email.queue
rabbitmq.queue.delivery=order.delivery.queue

# Fanout Exchange
rabbitmq.exchange=order.fanout.exchange

# Routing key (WAJIB ADA walaupun fanout sebenarnya tidak pakai ini)
rabbitmq.routingkey=order.routingkey

# Dead Letter Queue: menampung pesan yang gagal diproses
rabbitmq.dlq=order.dlq
rabbitmq.dlx=order.dlx
rabbitmq.dlq.routingkey=order.deadletter

# Publisher confirms (Spring Boot 3.x syntax)
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true

## Retry otomatis jika consumer gagal (3 kali, interval 1-10 detik)
#spring.rabbitmq.listener.simple.retry.enabled=true
#spring.rabbitmq.listener.simple.retry.initial-interval=1000
#spring.rabbitmq.listener.simple.retry.multiplier=2
#spring.rabbitmq.listener.simple.retry.max-interval=10000
#spring.rabbitmq.listener.simple.retry.max-attempts=3

# Manual acknowledgment
spring.rabbitmq.listener.simple.acknowledge-mode=manual
# Prefetch count (max pesan yang belum di-ack)
spring.rabbitmq.listener.simple.prefetch=1
# Retry configuration
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.max-interval=10000

# Actuator (monitoring)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging
logging.level.com.example.foodDelivery=INFO
logging.level.org.springframework.amqp=DEBUG

