server:
  port: 8000

spring:
  # 1. Sambungkan satpam (Gateway) ke Keycloak
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/eai-realm

  cloud:
    gateway:
      routes:
        # 2. Rute untuk aplikasi Order Management (Port 8080)
        - id: order-service
          uri: http://localhost:8080
          predicates:
            - Path=/api/orders/**, /customers/**, /api/products/**

        # 3. Rute untuk aplikasi Ecommerce (Port 8081)
        - id: ecommerce-service
          uri: http://localhost:8081
          predicates:
            - Path=/payment/**, /shipping/**