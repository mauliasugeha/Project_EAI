openapi: 3.0.0
info:
  title: Order Management API
  version: 1.0.0
  description: API untuk mengelola order dan customer

servers:
  - url: http://localhost:8080

paths:

  /auth/login:
    post:
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized

  /auth/logout:
    post:
      summary: Logout user
      responses:
        '200':
          description: Logout berhasil

  /customers:
    get:
      summary: Ambil semua customer
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Berhasil ambil data
        '403':
          description: Forbidden

components:

  schemas:
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password

    LoginResponse:
      type: object
      properties:
        token:
          type: string

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT